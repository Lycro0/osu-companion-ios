name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project OsuCompanion.xcodeproj \
            -scheme OsuCompanion \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/OsuCompanion.app Payload/
          zip -qr OsuCompanion.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: OsuCompanion-ipa
          path: OsuCompanion.ipa

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest OsuCompanion.ipa \
            --title "Latest IPA" \
            --notes "Unsigned IPA for sideloading (FlareStore, AltStore, Sideloadly). Built from ${{ github.sha }}."
