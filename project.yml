name: OsuCompanion
options:
  bundleIdPrefix: com.lycro
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OsuCompanion:
    type: application
    platform: iOS
    sources:
      - OsuCompanion
    info:
      path: OsuCompanion/Info.plist
      properties:
        CFBundleDisplayName: osu! Companion
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lycro.osucompanion
        TARGETED_DEVICE_FAMILY: "1,2"
